baseURL: "https://edfig.dev/"
title: EdFig.dev
theme: hugo-book

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
disablePathToLower: true
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
  highlight:
    style: monokai
    codeFences: true
    lineNos: true
    guessSyntax: true

params:
  BookTheme: dark
  BookSearch: true
  BookToC: true
  BookSection: docs
  BookDateFormat: "January 2, 2006"
  BookComments: false
  BookEditLink: 'https://github.com/efigueroa/figsystems/edit/main/content/{{ .Path }}'

menu:
  before:
    - name: "Tags"
      url: "/tags/"
      weight: 10
    - name: "Categories"
      url: "/categories/"
      weight: 20

  after:
    - name: "GitHub"
      url: "https://github.com/efigueroa"
      weight: 10
    - name: "Mastodon"
      url: "https://mastodon.social/@edfig"
      weight: 20
    - name: "Bluesky"
      url: "https://bsky.app/profile/edfig.dev"
      weight: 30
    - name: "RSS"
      url: "https://edfig.dev/index.xml"
      weight: 40
